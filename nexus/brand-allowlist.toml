# Allowlist cho `nexus-tools brand-check`.
# Mỗi mục cho phép một chuỗi thương hiệu upstream xuất hiện ở một đường dẫn (tương đối so với gốc repo).
# Nguyên tắc: khoanh hẹp `path` + `pattern`; mọi mục có lý do. Danh sách việc còn nợ: nexus/BRANDING_PATCH.md.

# ---------------------------------------------------------------------------------------------
# 1. Không phát hành: chú thích, test, tài liệu dev, metadata crate
# ---------------------------------------------------------------------------------------------

[[allow]]
path = "**/*.rs"
pattern = '^\s*//.*'
reason = "Chú thích Rust (//, ///, //!) không biên dịch vào binary, người dùng không thấy"

[[allow]]
path = "**/*.rs"
pattern = ' // .*$'
reason = "Chú thích Rust cuối dòng, không biên dịch vào binary"

[[allow]]
path = "**/*.{toml,yml,yaml,sh,py,ps1,in,desktop}"
pattern = '^\s*#.*'
reason = "Chú thích trong file cấu hình/script, không hiện cho người dùng"

[[allow]]
path = "**/*.{xml,in,wxs,html,svg}"
pattern = '<!--[^:>]*'
reason = "Chú thích XML/HTML, không hiện cho người dùng"

[[allow]]
path = "packaging/macos/Info.plist.in"
pattern = '^\s+(WordCraft opens|Nexus Docs opens).*'
reason = "Dòng tiếp của chú thích XML nhiều dòng"

[[allow]]
path = "{**/tests.rs,**/tests_*.rs,**/tests/**}"
pattern = '.*'
reason = "Mã test (văn bản mẫu 'Hello WordCraft', khẳng định hành vi upstream), không phát hành"

[[allow]]
path = "crates/proof/src/hyphen.rs"
pattern = '\["publication", "WordCraft"\]'
reason = "Dữ liệu test gạch nối (#[cfg(test)])"

[[allow]]
path = "crates/ui-egui/src/i18n/audit.rs"
pattern = 'matches!\(plain, "WordCraft" \|'
reason = "Whitelist của test audit i18n (#[cfg(test)])"

[[allow]]
path = "crates/ui-egui/src/i18n/brand.rs"
pattern = '.*'
reason = "Chính bảng thay thế WordCraft→Nexus Docs, ArtCraft→NexusOffice và test của nó"

[[allow]]
path = "{ROADMAP.md,AGENTS.md,CLAUDE.md,packaging/web/README.md,packaging/macos/dmg/README.md}"
pattern = '.*'
reason = "Tài liệu dev của upstream, không đóng gói, không phải giao diện (README.md đã viết lại cho Nexus Docs và được quét)"

[[allow]]
path = "**/Cargo.toml"
pattern = '^description = ".*"$'
reason = "Mô tả crate nội bộ (publish = false), không hiện cho người dùng"

[[allow]]
path = ".github/workflows/{release.yml,windows-arm64.yml}"
pattern = '.*'
reason = "CI phát hành của upstream (craft-common-actions); NexusOffice phát hành bằng nexus-release.yml (Task 12)"

[[allow]]
path = ".github/workflows/{nexus-ci.yml,nexus-sync.yml}"
pattern = 'github\.com/storytold/\$UPSTREAM_REPO'
reason = "Workflow NexusOffice (template trong NexusOffices/templates/workflows) phải lấy upstream để đếm patch và đồng bộ; không phát hành, người dùng không thấy"

[[allow]]
path = "assets/spelling/*-extra.txt"
pattern = '.*'
reason = "Từ điển chính tả (từ 'WordCraft' được coi là đúng chính tả), không phải chuỗi giao diện"

# ---------------------------------------------------------------------------------------------
# 2. Giao diện: brand() thay tên lúc chạy
# ---------------------------------------------------------------------------------------------

[[allow]]
path = "crates/ui-egui/src/**/*.rs"
pattern = 'tl!\(\s*"[^"/]*"'
reason = "Chuỗi đi qua tl! → i18n::brand() thay tên lúc chạy"

[[allow]]
path = "{crates/ui-egui/src/options.rs,crates/ui-egui/src/dialogs.rs,crates/ui-egui/src/file_browser.rs,crates/ui-egui/src/chrome.rs,crates/ui-egui/src/dialogs/dispatch.rs}"
pattern = '^\s*"[^"/]*WordCraft[^"/]*"$'
reason = "Đối số dòng tiếp theo của tl!( … ) nhiều dòng → i18n::brand()"

[[allow]]
path = "crates/ui-egui/src/dialogs/chrome.rs"
pattern = '=> "(About WordCraft|WordCraft)",'
reason = "Tiêu đề hộp thoại, hiển thị qua tl!(title) → i18n::brand()"

[[allow]]
path = "crates/engine/src/cmd/citations.rs"
pattern = '"Researcher needs an online service; WordCraft keeps your documents offline\."'
reason = "Key catalog (vi.tsv và các catalog khác): trạng thái lên giao diện qua tl! → i18n::brand(); giữ key để không lệch catalog upstream (quyết định của controller)"

# ---------------------------------------------------------------------------------------------
# 3. Ghi công upstream (bắt buộc theo giấy phép / brand license, chỉ chữ)
# ---------------------------------------------------------------------------------------------

[[allow]]
path = "crates/ui-egui/src/nexus.rs"
pattern = '"(NexusOffice is developed from the open-source apps of ArtCraft[^"]*|NexusOffice được phát triển dựa trên các ứng dụng mã nguồn mở của ArtCraft[^"]*|MIT OR Apache-2\.0\. Copyright \(c\) 2026 ArtCraft Team and the WordCraft contributors\.)"'
reason = "Câu ghi công + thông báo bản quyền upstream trong About (giấy phép MIT/Apache, LICENSE-brand.txt cho phép ghi chữ)"

[[allow]]
path = "crates/ui-egui/src/nexus.rs"
pattern = 'contains\("(ArtCraft|WordCraft)"\)'
reason = "Test (#[cfg(test)]) khẳng định câu ghi công giữ tên upstream"

[[allow]]
path = "crates/ui-egui/src/nexus.rs"
pattern = 'upstream.s \(ArtCraft.s Discord\)'
reason = "Chú thích doc giải thích vì sao ẩn link cộng đồng"

[[allow]]
path = "README.md"
pattern = '(Nexus Docs được phát triển dựa trên WordCraft của ArtCraft|Nexus Docs is developed from WordCraft by ArtCraft) \(MIT/Apache-2\.0\)\.'
reason = "Câu ghi công upstream trong README (chỉ chữ, không logo/link)"

[[allow]]
path = "apps/wordcraft/build.rs"
pattern = 'based on WordCraft by the ArtCraft team'
reason = "Ghi công upstream trong LegalCopyright của exe"

[[allow]]
path = "packaging/macos/Info.plist.in"
pattern = 'Based on WordCraft by the ArtCraft team'
reason = "Ghi công upstream trong NSHumanReadableCopyright"

[[allow]]
path = "packaging/macos/Info.plist.in"
pattern = '<key>WordCraft(Version|BuildCommit)</key>'
reason = "Khoá nội bộ của Info.plist (không hiển thị), giữ để giảm diff"

[[allow]]
path = "packaging/windows/package.ps1"
pattern = 'based on the open-source WordCraft by the ArtCraft team'
reason = "Ghi công upstream trong trang giấy phép của bộ cài MSI"

[[allow]]
path = "packaging/linux/vn.sonnytech.nexus.docs.metainfo.xml.in"
pattern = 'based on the open-source WordCraft by the ArtCraft team'
reason = "Ghi công upstream trong mô tả AppStream"

[[allow]]
path = "packaging/linux/nfpm.yaml"
pattern = '^\s+WordCraft by the ArtCraft team\.$'
reason = "Ghi công upstream trong mô tả gói deb/rpm (dòng tiếp)"

# ---------------------------------------------------------------------------------------------
# 4. Định danh/đường dẫn kỹ thuật và file upstream không dùng trong bản Nexus
# ---------------------------------------------------------------------------------------------

[[allow]]
path = "crates/proof/src/hunspell.rs"
pattern = 'base\.join\("WordCraft"\)\.join\("dictionaries"\)'
reason = "Thư mục từ điển Hunspell dùng chung (chỉ đọc); không phải chuỗi hiển thị"

[[allow]]
path = "{packaging/linux/ai.storyteller.wordcraft.desktop,packaging/linux/ai.storyteller.wordcraft.metainfo.xml.in,packaging/linux/flatpak/*.yml,packaging/linux/flatpak-bundle.sh}"
pattern = '.*'
reason = "Metadata Linux/Flatpak của upstream, không dùng: package.sh của Nexus cài vn.sonnytech.nexus.docs.* (Flatpak chưa phát hành)"

[[allow]]
path = "packaging/macos/dmg/generate.py"
pattern = '.*'
reason = "Script tạo layout DMG chỉ chạy trên macOS; layout DMG Nexus làm lại ở Task 12"

# ---------------------------------------------------------------------------------------------
# 5. Việc còn nợ (đã ghi trong BRANDING_PATCH.md, cần PR white-label lên upstream)
# ---------------------------------------------------------------------------------------------

[[allow]]
path = "crates/docbin/src/media.rs"
pattern = '"[^"]*WordCraft[^"]*"'
reason = "Thông điệp log (log::warn), không hiện trên giao diện"

[[allow]]
path = "{assets/app-icon/wordcraft.svg,assets/app-icon/hicolor/scalable/apps/ai.storyteller.wordcraft.svg}"
pattern = '<!--[^:>]*'
reason = "Icon upstream không còn dùng (Nexus dùng nexus/assets/)"

# ---------------------------------------------------------------------------------------------
# 6. Đồng bộ upstream 2026-10-29 (egui 0.37)
# ---------------------------------------------------------------------------------------------

[[allow]]
path = "{Cargo.toml,Cargo.lock}"
pattern = 'github\.com/storytold/(egui|winit)\.git'
reason = "Bản vá egui/winit mà upstream ghim qua [patch.crates-io] (egui 0.37); URL nguồn lúc build, không phát hành, người dùng không thấy"

[[allow]]
path = "assets/spelling/en-variants.txt"
pattern = '^#.*'
reason = "Chú thích đầu file danh sách biến thể chính tả tiếng Anh, không phải chuỗi giao diện"

[[allow]]
path = "{crates/docbin/src/lib.rs,crates/docx/src/write/embed.rs,crates/zotero/src/fields.rs}"
pattern = '"[^"]*WordCraft[^"]*"'
reason = "Thông điệp log (log::warn), không hiện trên giao diện"

[[allow]]
path = "{crates/docx/src/write/bidi.rs,crates/ui-egui/src/ibeam.rs}"
pattern = '"(עברית WordCraft|Hello WordCraft)"'
reason = "Văn bản mẫu trong module #[cfg(test)], không phát hành"

[[allow]]
path = "crates/ui-egui/build.rs"
pattern = "WordCraft's catalog"
reason = "Chú thích doc trong mã sinh ra lúc build (craft_i18n.rs), không hiện cho người dùng"

[[allow]]
path = "{packaging/freebsd/package.sh,packaging/windows/INSTALLATION.md,packaging/windows/check-install-policy.ps1,packaging/windows/install-policy.json,packaging/windows/install-policy.wxi,packaging/windows/test-packaging-script.ps1}"
pattern = '.*'
reason = "Đóng gói upstream không dùng: Nexus Docs không phát hành FreeBSD, và MSI Nexus (wordcraft.wxs, UpgradeCode riêng, per-machine) không dùng chính sách cài đặt hai phạm vi của WordCraft; NexusOffices cài bằng bộ cài của suite"

[[allow]]
path = ".github/workflows/{nexus-ci.yml,nexus-release.yml}"
pattern = 'github\.com/storytold/craft-i18n'
reason = "Bản dịch giao diện (cả tiếng Việt) upstream chuyển ra storytold/craft-i18n (đầu vào build CRAFT_I18N_DIR, ghim ở craft-i18n.rev); workflow lấy về lúc build, không phát hành URL"
